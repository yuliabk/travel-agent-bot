name: Webform CI

on:
  pull_request:
    paths:
      - 'webform/**'
      - '.github/workflows/webform-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webform
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webform/package.json
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        env:
          TRAVEL_AGENT_API_URL: http://127.0.0.1:8000
          TRAVEL_AGENT_WEB_TOKEN: ci-placeholder-not-a-secret
          NEXTAUTH_URL: http://localhost:3000
        run: npm run build
