[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    -v
    --strict-markers
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
markers =
    unit: fast isolated unit tests
    integration: tests exercising multiple components
